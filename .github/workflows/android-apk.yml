name: Android test APK

# Builds an installable test APK on GitHub's servers (they ship the Android SDK)
# and publishes it as the "android-test" pre-release, so it can be downloaded
# straight from a phone. Signed with the debug key: for testing, not the Play Store.

on:
  push:
    branches: [claude/sleepy-wozniak-nmu6dv, main]
    paths:
 Server the app talks to (set to the Railway URL once it exists).- apps/mobile/**
 Server the app talks to (set to the Railway URL once it exists).- packages/shared/**
 Server the app talks to (set to the Railway URL once it exists).- package-lock.json
 Server the app talks to (set to the Railway URL once it exists).- .github/workflows/android-apk.yml
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
 Server the app talks to (set to the Railway URL once it exists).CI: "1"
 Server the app talks to (set to the Railway URL once it exists).# Server the app talks to (set to the Railway URL once it exists).
 Server the app talks to (set to the Railway URL once it exists).EXPO_PUBLIC_API_URL: ${{ vars.SPEOW_API_URL || 'https://speow-api.onrender.com' }}
 Server the app talks to (set to the Railway URL once it exists).# Test builds may switch server from the welcome screen.
 Server the app talks to (set to the Railway URL once it exists).EXPO_PUBLIC_ALLOW_SERVER_OVERRIDE: "1"
 Server the app talks to (set to the Railway URL once it exists).ALLOW_CLEARTEXT: "0"
 Server the app talks to (set to the Railway URL once it exists).NODE_OPTIONS: --max-old-space-size=4096
    steps:
 Server the app talks to (set to the Railway URL once it exists).- uses: actions/checkout@v4

 Server the app talks to (set to the Railway URL once it exists).- uses: actions/setup-node@v4
 Server the app talks to (set to the Railway URL once it exists).  with:
 Server the app talks to (set to the Railway URL once it exists).    node-version: 22
 Server the app talks to (set to the Railway URL once it exists).    cache: npm

 Server the app talks to (set to the Railway URL once it exists).- uses: actions/setup-java@v4
 Server the app talks to (set to the Railway URL once it exists).  with:
 Server the app talks to (set to the Railway URL once it exists).    distribution: temurin
 Server the app talks to (set to the Railway URL once it exists).    java-version: 17

 Server the app talks to (set to the Railway URL once it exists).- uses: gradle/actions/setup-gradle@v4

 Server the app talks to (set to the Railway URL once it exists).- run: npm ci

 Server the app talks to (set to the Railway URL once it exists).- name: Generate native Android project
 Server the app talks to (set to the Railway URL once it exists).  working-directory: apps/mobile
 Server the app talks to (set to the Railway URL once it exists).  run: npx expo prebuild --platform android --no-install

 Server the app talks to (set to the Railway URL once it exists).- name: Build release APK (arm64 phones)
 Server the app talks to (set to the Railway URL once it exists).  working-directory: apps/mobile/android
 Server the app talks to (set to the Railway URL once it exists).  run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

 Server the app talks to (set to the Railway URL once it exists).- name: Publish to the android-test pre-release
 Server the app talks to (set to the Railway URL once it exists).  env:
 Server the app talks to (set to the Railway URL once it exists).    GH_TOKEN: ${{ github.token }}
 Server the app talks to (set to the Railway URL once it exists).  run: |
 Server the app talks to (set to the Railway URL once it exists).    APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
 Server the app talks to (set to the Railway URL once it exists).    cp "$APK" speow-test.apk
 Server the app talks to (set to the Railway URL once it exists).    SHORT=$(git rev-parse --short HEAD)
 Server the app talks to (set to the Railway URL once it exists).    gh release delete android-test --yes --cleanup-tag || true
 Server the app talks to (set to the Railway URL once it exists).    gh release create android-test speow-test.apk \
 Server the app talks to (set to the Railway URL once it exists).      --prerelease \
 Server the app talks to (set to the Railway URL once it exists).      --target "$GITHUB_SHA" \
 Server the app talks to (set to the Railway URL once it exists).      --title "Speow! test APK ($SHORT)" \
 Server the app talks to (set to the Railway URL once it exists).      --notes "Test build from commit $SHORT. Server: ${EXPO_PUBLIC_API_URL:-not set — tap 'Set server address' on the welcome screen}. Install on Android: open speow-test.apk from your phone and allow installs from your browser."

 Server the app talks to (set to the Railway URL once it exists).- uses: actions/upload-artifact@v4
 Server the app talks to (set to the Railway URL once it exists).  with:
 Server the app talks to (set to the Railway URL once it exists).    name: speow-test-apk
 Server the app talks to (set to the Railway URL once it exists).    path: speow-test.apk
 Server the app talks to (set to the Railway URL once it exists).    retention-days: 14
